[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real2sim2real-controller-actor-training"
version = "0.1.0"
description = "FlashCHORD simulation and FlashSAC residual policy training"
requires-python = ">=3.11,<3.13"
dependencies = ["real2sim2real==0.1.0", "hydra-core==1.3.2", "omegaconf==2.3.1", "numpy>=1.26,<3"]

[project.optional-dependencies]
video = ["Pillow>=10.1,<13", "scipy>=1.11,<2", "trimesh>=4.5,<5", "fast-simplification>=0.1.9,<1", "imageio-ffmpeg>=0.5,<1", "pyarrow>=16"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt", "*.cpp", "*.h", "*.hpp", "*.cmake", "*.cu", "*.cuh", "*.sh", "LICENSE", "NOTICE", "CMakeLists.txt"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*"]
