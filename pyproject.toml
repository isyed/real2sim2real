[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real2sim2real"
version = "0.1.0"
description = "Composable video reconstruction, reference repair, retargeting and controller training"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=1.26,<3", "scipy>=1.11,<2", "Pillow>=10,<14", "trimesh>=4", "pyarrow>=16", "hydra-core==1.3.2"]

[project.scripts]
r2s2r = "real2sim2real.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests", "modules/reconstruction-repair/tests"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*"]
