[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real2sim2real"
version = "0.1.0"
description = "Composable video reconstruction, reference repair, retargeting and controller training"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
visualization = ["numpy>=1.26,<3", "scipy>=1.11,<2", "Pillow>=10,<14", "trimesh>=4", "imageio-ffmpeg>=0.5,<1", "fast-simplification>=0.2,<1"]
test = ["pytest>=8,<10", "numpy>=1.26,<3", "scipy>=1.11,<2", "Pillow>=10,<14", "trimesh>=4", "pyarrow>=16", "hydra-core==1.3.2", "h5py>=3", "opencv-python-headless>=4,<6", "safetensors>=0.4,<1", "imageio-ffmpeg>=0.5,<1", "rtree>=1.3,<2", "fast-simplification>=0.2,<1"]

[project.scripts]
r2s2r = "real2sim2real.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests", "modules/reconstruction-repair/tests"]
pythonpath = ["src", "modules/reconstruction/src", "modules/reconstruction-repair/src", "modules/reconstruction-evaluation/src", "modules/egocentric-reconstruction/src", "modules/retargeting/src", "modules/controller-actor-training/src"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*"]
