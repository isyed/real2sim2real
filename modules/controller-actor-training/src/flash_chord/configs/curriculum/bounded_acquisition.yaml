_target_: flash_chord.configuration.make_fixed_curriculum
# A short experimental recipe, not a claim of reliable task execution.
# Stages are indexed by collected transitions across all parallel worlds.
thresholds: [2000000, 4000000, 6000000, 10000000]
stages:
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 1.0
    immediate_first_frame_probability: 0.25
    objective_weights: &weights
      termination: -300.0
      action_rate_l2: -0.0001
      action_l2: -0.000001
      soft_joint_limit: -0.001
      pelvis_position: 1.0
      pelvis_orientation: 1.0
      body_joint_position: 5.0
      object_position: 1.0
      progress: 1.0
      palm_position: 1.0
      palm_orientation: 1.0
      force_closure: 5.0
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.5
    immediate_first_frame_probability: 0.5
    objective_weights: *weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.1
    immediate_first_frame_probability: 0.5
    objective_weights: *weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    immediate_first_frame_probability: 0.5
    objective_weights: *weights
