[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real2sim2real-reconstruction-evaluation"
version = "0.1.0"
description = "Offline metric geometry and trajectory evaluation"
requires-python = ">=3.11,<3.13"
dependencies = ["real2sim2real==0.1.0", "numpy>=1.26,<3", "scipy>=1.11,<2", "trimesh>=4", "pyarrow>=16"]

[project.scripts]
r2s2r-evaluate = "real2sim2real.evaluation.cli:main"
r2s2r-reconstruction-report = "real2sim2real.evaluation.report:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools]
license-files = ["LICENSE"]
